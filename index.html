<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rain Window</title>
<style>
  html, body { margin: 0; height: 100%; background: #9aa8a2; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 20px; bottom: 18px;
    font: 12px/1.4 -apple-system, system-ui, sans-serif; letter-spacing: .04em;
    color: rgba(20, 32, 26, .55); transition: opacity 1.2s;
    pointer-events: none; user-select: none;
  }
  body.idle { cursor: none; }
  body.idle #hint, body.idle #island { opacity: 0; pointer-events: none; }

  /* ---- control island: a frosted-glass pill that opens into a panel ---- */
  #island {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    width: 210px; max-width: calc(100vw - 32px); box-sizing: border-box;
    border-radius: 24px; overflow: hidden; user-select: none; -webkit-user-select: none;
    color: #fff; font: 13px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: rgba(16, 22, 19, .36);
    backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .16);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .14);
    transition: width .5s cubic-bezier(.3, 1.25, .45, 1), border-radius .5s, opacity 1.2s;
  }
  #island.open { width: 372px; border-radius: 30px; }
  :where(#island button) { all: unset; box-sizing: border-box; cursor: pointer; } /* zero specificity, so the rules below win */
  #island button:focus-visible, #island .dots:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 3px; border-radius: 10px; }
  .head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 16px; }
  .head svg { flex: none; }
  .head .name { flex: 1; font-weight: 600; font-size: 14px; letter-spacing: .01em; }
  .head .mini { display: flex; gap: 3px; }
  .head .mini i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .22); transition: background .2s; }
  .head .mini i.on { background: #fff; }
  .head .sub { display: none; color: rgba(255, 255, 255, .55); font-variant-numeric: tabular-nums; }
  #island.open .head .mini { display: none; }
  #island.open .head .sub { display: inline; }
  .full { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.3, 1, .4, 1); }
  #island.open .full { grid-template-rows: 1fr; }
  .inner { min-height: 0; overflow: hidden; padding: 0 18px; }
  .inner > :last-child { margin-bottom: 18px; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .presets button {
    display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 9px 0 10px;
    border-radius: 18px; color: rgba(255, 255, 255, .55); transition: background .25s, color .25s;
  }
  .presets button:hover { color: rgba(255, 255, 255, .85); }
  .presets button.on { color: #fff; background: rgba(255, 255, 255, .13); }
  .presets .t { font-size: 11px; letter-spacing: .03em; }
  .presets .n { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rule { height: 1px; background: rgba(255, 255, 255, .1); margin: 14px 0 4px; }
  .meter { margin-top: 12px; }
  .mh { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .ml { display: flex; align-items: center; gap: 7px; }
  .mv { font-variant-numeric: tabular-nums; }
  .mute { display: inline-flex; opacity: .85; }
  .mute:hover { opacity: 1; }
  .dots { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; padding: 3px 0; cursor: pointer; touch-action: none; }
  .dots i { aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .16); transition: background .18s, transform .18s; }
  .dots i.on { background: #fff; }
  .dots:hover i.on:last-of-type { transform: scale(1.1); }
  @media (prefers-reduced-motion: reduce) { #island, .full, .dots i { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click: mute · F fullscreen</div>
<div id="island">
  <button class="head" id="islandHead" aria-expanded="false" aria-controls="islandFull">
    <span class="ico"></span><span class="name"></span><span class="mini"></span><span class="sub"></span>
  </button>
  <div class="full" id="islandFull"><div class="inner">
    <div class="presets"></div>
    <div class="rule"></div>
    <div class="meter" id="mRain"></div>
    <div class="meter" id="mVol"></div>
    <div class="meter" id="mNature"></div>
  </div></div>
</div>
<script>
'use strict';
const cv = document.getElementById('c');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');         // the blurry view through the glass
const sharp = document.createElement('canvas'), sctx = sharp.getContext('2d');   // the brighter view that drops refract
const mist = document.createElement('canvas'), mctx = mist.getContext('2d');     // tiny droplets (part of the water map)
const water = document.createElement('canvas'), wctx = water.getContext('2d');   // water map: every bit of water on the glass
const curtain = document.createElement('canvas'), cctx = curtain.getContext('2d');  // rain falling outside (its own layer so the blur doesn't eat it)
const bgSoft = document.createElement('canvas'), bsctx = bgSoft.getContext('2d'); // tiny copy of the view: heavy blur when it pours
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');       // fog on the glass (alpha = how fogged)
const FOG_S = 0.25, FOG_TIME = 10;    // fog map scale; seconds for wiped glass to fog up again (raindrop-fx: mistTime 10)
const SS = 0.1;               // resolution of the view seen through drops (low = soft, like codrops)
const TAU = Math.PI * 2;
const K = 3;                  // drop size scale (px per unit)
let W = 0, H = 0, DPR = 1;
let layers = [], drops = [];
let skyMain, skySharp, fogMain, fogSharp;
let frameDt = 0.016, storm = 0, gust = 0, gustTarget = 0, gustT = 0, flash = 0, nextFlash = 6, bolts = [];
let sideways = 1, volume = 0.6, natureVol = 0.5, intensity = 1, speed = 0.7, speedTarget = 0.7, speedTimer = 10;
let spawnAcc = 0, mistAcc = 0, audio = null, audioTimer = 0;

// ---------- water stamps ----------
// Every drop is stamped into the water map. The colours aren't colours: R and G say
// which way the water surface tilts at that point (so the shader knows where to bend
// the light), B is how thick the drop is. Alpha is a soft falloff, so stamps that
// overlap add up and melt into one surface; the shader cuts it at about VIS of the
// stamp's radius, which is where the drop's visible edge ends up.
const VIS = 0.34, STAMP = 96, STAMPS = 16;   // VIS: where the gaussian crosses the shader's cut (0.5)
const stamps = Array.from({ length: STAMPS }, (_, i) => {
  const c = document.createElement('canvas'); c.width = c.height = STAMP;
  const g = c.getContext('2d'), im = g.createImageData(STAMP, STAMP), p = im.data;
  const thick = 0.15 + 0.85 * i / (STAMPS - 1), h = STAMP / 2;
  for (let y = 0; y < STAMP; y++) for (let x = 0; x < STAMP; x++) {
    const nx = (x + 0.5) / h - 1, ny = (y + 0.5) / h - 1, d2 = nx * nx + ny * ny, k = (y * STAMP + x) * 4;
    // same profile as codrops' drop-alpha.png: gaussian falloff (long and soft below
    // and to the sides), but the top is cut off sharply
    const top = ny < -0.47 ? Math.max(0, 1 - (-0.47 - ny) / 0.15) : 1;
    const alpha = Math.exp(-d2 / (2 * 0.288 * 0.288)) * top;
    if (alpha < 0.004) continue;
    const sx = Math.max(-1, Math.min(1, nx / VIS)), sy = Math.max(-1, Math.min(1, ny / VIS));
    p[k] = (0.5 - sy * 0.5) * 255;
    p[k + 1] = (0.5 - sx * 0.5) * 255;
    p[k + 2] = thick * 255;
    p[k + 3] = alpha * 255;
  }
  g.putImageData(im, 0, 0);
  return c;
});
const stampFor = r => stamps[Math.min(STAMPS - 1, r / (6 * K) * STAMPS | 0)];   // thickness by absolute size

// ---------- WebGL: melt, refract, composite ----------
const gl = cv.getContext('webgl', { alpha: false, antialias: false, premultipliedAlpha: false });
const FS = `precision mediump float;
uniform sampler2D uWater, uBg, uFg, uBgSoft, uRain, uFog;
uniform float uFogAmt;
uniform float uTime;
uniform vec2 uRes, uCss;
uniform float uRefMin, uRefDelta, uBright, uDark, uFlash;
void main() {
  vec2 uv = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uRes;
  // a sheet of water running down the glass wobbles the whole view (only when it pours)
  vec2 sheet = vec2(sin(uv.y * 34.0 - uTime * 4.5 + sin(uv.x * 21.0 + uTime * 0.7) * 1.5) * 0.004
                  + sin(uv.y * 90.0 - uTime * 9.0 + uv.x * 13.0) * 0.0012, 0.0) * uDark;
  vec3 bg = mix(texture2D(uBg, uv + sheet).rgb, texture2D(uBgSoft, uv + sheet * 2.0).rgb, uDark * 0.75);
  bg = mix(bg, vec3(0.86, 0.9, 0.93), texture2D(uRain, uv + sheet).a * 0.85);   // the rain curtain outside
  // fog on the glass: where it hasn't been wiped, the view goes soft and pale
  float fogA = texture2D(uFog, uv).a * uFogAmt;
  vec3 fogged = mix(texture2D(uBgSoft, uv).rgb, vec3(0.8, 0.84, 0.82), 0.32);
  bg = mix(bg, fogged, fogA);
  vec4 w = texture2D(uWater, uv);
  // overlapping soft stamps add up; cutting the sum makes neighbours melt together
  float a = clamp(w.a * 6.0 - 3.0, 0.0, 1.0);   // codrops' cut (alphaMultiply 6, alphaSubtract 3)
  vec2 tilt = (vec2(w.g, w.r) - 0.5) * 2.0;
  vec2 pos = uv + tilt * (uRefMin + w.b * uRefDelta) / uCss;
  // light gathered by the drop: the refracted view is brighter and a bit washed out
  vec3 fg = texture2D(uFg, pos).rgb * uBright + 0.07;
  // a faint shadow just outside the water's edge, so drops read on a pale sky
  float rim = 0.0;
  vec3 col = mix(bg * (1.0 - rim * 0.18), fg, a);
  vec2 q = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  col *= 1.0 - smoothstep(0.35, 0.95, length(q)) * (0.32 + 0.2 * uDark);
  float grey = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, vec3(grey), 0.35 * uDark) * mix(vec3(1.0), vec3(0.88, 0.94, 1.08), uDark); // cold, washed-out storm light
  col *= 1.0 - 0.28 * uDark;
  col *= 1.0 + uFlash * 1.3;                                  // lightning lifts what's already lit
  col = mix(col, vec3(0.93, 0.96, 1.0), uFlash * 0.12);
  gl_FragColor = vec4(col, 1.0);
}`;
function compile(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc); gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const texUnits = [water, bg, sharp, bgSoft, curtain, fog].map((src, i) => {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
    [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  return { t, src };
});
gl.uniform1i(U('uWater'), 0); gl.uniform1i(U('uBg'), 1); gl.uniform1i(U('uFg'), 2); gl.uniform1i(U('uBgSoft'), 3); gl.uniform1i(U('uRain'), 4); gl.uniform1i(U('uFog'), 5);
gl.uniform1f(U('uRefMin'), 60); gl.uniform1f(U('uRefDelta'), 120); gl.uniform1f(U('uBright'), 1.12);
function render() {
  gl.uniform1f(U('uDark'), storm); gl.uniform1f(U('uFogAmt'), curve(FOG_CURVE, intensity)); gl.uniform1f(U('uTime'), (performance.now() / 1000) % 1000); gl.uniform1f(U('uFlash'), flash);
  texUnits.forEach(({ t, src }, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  });
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- setup ----------
function skyGradient(g) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#a3b1ad');
  gr.addColorStop(0.3, '#c6d0cc');
  gr.addColorStop(0.55, '#b7c3be');
  gr.addColorStop(1, '#8e9c93');
  return gr;
}
function fogGradient(g) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#cdd6d2');
  gr.addColorStop(0.6, '#bcc8c2');
  gr.addColorStop(1, '#a9b6ae');
  return gr;
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U('uRes'), cv.width, cv.height); gl.uniform2f(U('uCss'), W, H);
  bg.width = W; bg.height = H;
  bgSoft.width = Math.ceil(W / 10); bgSoft.height = Math.ceil(H / 10);
  curtain.width = Math.ceil(W / 2); curtain.height = Math.ceil(H / 2); cctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  fog.width = Math.ceil(W * FOG_S); fog.height = Math.ceil(H * FOG_S); fctx.setTransform(FOG_S, 0, 0, FOG_S, 0, 0);
  const fg0 = fctx.createLinearGradient(0, 0, 0, H);            // start with spray already on the glass, heavier low down
  fg0.addColorStop(0, 'rgba(255,255,255,0.45)'); fg0.addColorStop(1, 'rgba(255,255,255,0.95)');
  fctx.fillStyle = fg0; fctx.fillRect(0, 0, W, H);
  sharp.width = Math.ceil(W * SS); sharp.height = Math.ceil(H * SS); sctx.setTransform(SS, 0, 0, SS, 0, 0);
  mist.width = W; mist.height = H;
  water.width = W; water.height = H;
  skyMain = skyGradient(bctx); skySharp = skyGradient(sctx);
  fogMain = fogGradient(bctx); fogSharp = fogGradient(sctx);
  MAX_R = curve(SIZE_CURVE, intensity);
  drops = []; buildForest(); seedMist();
  for (let i = 0; i < W * H / 9000; i++) spawnDrop(Math.random() * W, Math.random() * H);
}

// ---------- the forest outside ----------
// far → near. top/h are fractions of the screen height; gap is px between trees;
// v is parallax speed (px/s at full car speed); fog is mist laid over everything up to this layer.
const LAYERS = [
  { col: [147, 165, 156], top: [0.30, 0.42], h: [0.14, 0.26], gap: 12, fill: 0.50, v: 16, blur: 2.5, fog: 0.40, kinds: 'c' },
  { col: [111, 133, 122], top: [0.22, 0.38], h: [0.22, 0.36], gap: 18, fill: 0.56, v: 50, blur: 3.5, fog: 0.30, kinds: 'ccd' },
  { col: [74, 96, 82], top: [0.08, 0.30], h: [0.40, 0.62], gap: 42, fill: 0.66, v: 130, blur: 5, fog: 0.2, kinds: 'ccdt' },
  { col: [44, 60, 50], top: [-0.25, 0.05], h: [0.9, 1.2], gap: 120, fill: 0.78, v: 320, blur: 8, fog: 0.06, kinds: 'ttc' },
  { col: [48, 66, 42], ground: true, fill: 0.88, v: 620, blur: 8, fog: 0 },
  { col: [20, 29, 23], trunks: true, gap: 560, v: 980, blur: 15, fog: 0 }
];
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const shade = (c, f) => `rgb(${Math.min(255, c[0] * f) | 0},${Math.min(255, c[1] * f) | 0},${Math.min(255, c[2] * f) | 0})`;
function conifer(g, rnd, x, top, h) {
  const w = h * (0.3 + rnd() * 0.14);
  g.fillRect(x - w * 0.035, top + h * 0.5, w * 0.07, H * 2);
  const n = 6 + (rnd() * 5 | 0);
  for (let i = 0; i < n; i++) {
    const f = (i + 1) / n, ty = top + h * (i / n) * 0.9, hw = w * f * 0.5 * (0.8 + rnd() * 0.4), th = h * 0.24;
    g.beginPath(); g.moveTo(x + (rnd() - 0.5) * 2, ty);
    g.lineTo(x + hw, ty + th); g.lineTo(x + hw * 0.3, ty + th * 0.9);
    g.lineTo(x - hw * 0.3, ty + th * 0.92); g.lineTo(x - hw, ty + th * (0.95 + rnd() * 0.1));
    g.closePath(); g.fill();
  }
}
function broadleaf(g, rnd, x, top, h) {
  g.fillRect(x - h * 0.02, top + h * 0.4, h * 0.04, H * 2);
  const n = 7 + (rnd() * 6 | 0);
  for (let i = 0; i < n; i++) {
    const r = h * (0.1 + rnd() * 0.12);
    g.beginPath(); g.arc(x + (rnd() - 0.5) * h * 0.4, top + r + rnd() * h * 0.35, r, 0, TAU); g.fill();
  }
}
function tallTrunk(g, rnd, x, top, h) {
  const w = h * (0.025 + rnd() * 0.02);
  g.beginPath(); g.moveTo(x - w * 0.35, top); g.lineTo(x + w * 0.35, top);
  g.lineTo(x + w * 0.5, H * 2); g.lineTo(x - w * 0.5, H * 2); g.fill();
  const n = 4 + (rnd() * 4 | 0);
  for (let i = 0; i < n; i++) {
    const r = h * (0.05 + rnd() * 0.07);
    g.beginPath(); g.arc(x + (rnd() - 0.5) * h * 0.22, top + rnd() * h * 0.25, r, 0, TAU); g.fill();
  }
}
function paintLayer(g, cfg, rnd, tw) {
  const items = [];
  if (cfg.trunks) {
    const n = Math.max(1, Math.round(tw / cfg.gap));
    for (let i = 0; i < n; i++) items.push({ k: 'T', x: (i + rnd() * 0.7) * tw / n, w: 22 + rnd() * 60, f: 0.8 + rnd() * 0.4 });
  } else if (cfg.ground) {
    for (let x = 0; x < tw; x += 2 + rnd() * 3) items.push({ k: 'g', x, h: H * (0.04 + rnd() * rnd() * 0.12), lean: (rnd() - 0.5) * 18, f: 0.75 + rnd() * 0.6 });
    for (let i = 0; i < tw / 60; i++) items.push({ k: 'b', x: rnd() * tw, r: H * (0.03 + rnd() * 0.05), f: 0.8 + rnd() * 0.4 });
  } else {
    const n = Math.round(tw / cfg.gap);
    for (let i = 0; i < n; i++) items.push({
      k: cfg.kinds[rnd() * cfg.kinds.length | 0], x: rnd() * tw,
      top: H * (cfg.top[0] + rnd() * (cfg.top[1] - cfg.top[0])),
      h: H * (cfg.h[0] + rnd() * (cfg.h[1] - cfg.h[0])), f: 0.85 + rnd() * 0.3, s: rnd() * 1e9 | 0
    });
    items.sort((a, b) => a.top - b.top);
  }
  if (cfg.fill) { g.fillStyle = shade(cfg.col, cfg.ground ? 0.8 : 1); g.fillRect(-tw, H * cfg.fill, tw * 3, H); }
  for (const it of items) for (const ox of [-tw, 0, tw]) {
    const x = it.x + ox;
    g.fillStyle = shade(cfg.col, it.f);
    const r = mulberry(it.s || 1);
    if (it.k === 'c') conifer(g, r, x, it.top, it.h);
    else if (it.k === 'd') broadleaf(g, r, x, it.top, it.h);
    else if (it.k === 't') tallTrunk(g, r, x, it.top, it.h);
    else if (it.k === 'T') {
      g.fillRect(x - it.w / 2, -10, it.w, H + 20);
      g.fillStyle = shade(cfg.col, it.f * 1.6); g.fillRect(x - it.w / 2, -10, it.w * 0.18, H + 20);
    } else if (it.k === 'g') {
      g.strokeStyle = shade(cfg.col, it.f); g.lineWidth = 2;
      const base = H * cfg.fill + 4;
      g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + it.lean * 0.3, base - it.h * 0.6, x + it.lean, base - it.h); g.stroke();
    } else if (it.k === 'b') {
      g.beginPath(); g.arc(x, H * cfg.fill + it.r * 0.4, it.r, 0, TAU); g.fill();
    }
  }
}
function buildForest() {
  layers = LAYERS.map((cfg, i) => {
    const tw = Math.ceil(W * 1.4) + 200, pad = Math.ceil(cfg.blur * 3);
    const tmp = document.createElement('canvas'); tmp.width = tw + pad * 2; tmp.height = H;
    const tg = tmp.getContext('2d'); tg.translate(pad, 0);
    paintLayer(tg, cfg, mulberry(1234 + i * 77), tw);
    const main = document.createElement('canvas'); main.width = tw; main.height = H;
    const mg = main.getContext('2d'); mg.filter = `blur(${cfg.blur}px)`; mg.drawImage(tmp, -pad, 0);
    const sh = document.createElement('canvas'); sh.width = Math.ceil(tw * SS); sh.height = Math.ceil(H * SS);
    const shg = sh.getContext('2d'); shg.filter = 'blur(1.5px)'; // a little soft, like codrops' tiny fg texture
    shg.drawImage(tmp, pad, 0, tw, H, 0, 0, sh.width, sh.height);
    return { cfg, main, sharp: sh, tw, off: Math.random() * tw };
  });
}
function updateForest(dt) {
  // the car speeds up, slows down, sometimes stops for a while
  speedTimer -= dt;
  if (speedTimer <= 0) {

// rate and spot in the stereo field. A handful of birds each have their own song
// (a whistle, a trill, quick chirps or a warble) and repeat it now and then from
// somewhere in the trees; heavy rain makes them quieter and rarer.
function makeImpulse(ac, secs, decay) {
  const len = ac.sampleRate * secs, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function startNature(ac, out) {
  const bus = ac.createGain(); bus.gain.value = natureVol * 0.9;
  const verb = ac.createConvolver(); verb.buffer = makeImpulse(ac, 2.5, 3);
  const wet = ac.createGain(); wet.gain.value = 0.35;
  bus.connect(out); bus.connect(verb).connect(wet).connect(out);
  const crickets = Array.from({ length: 3 }, () => ({
    f: rnd(3800, 5200), pan: rnd(-0.8, 0.8), gain: rnd(0.05, 0.09),
    pulses: 2 + (Math.random() * 3 | 0), rate: rnd(22, 34), gap: rnd(0.45, 1.1), next: ac.currentTime + rnd(0.5, 4), on: true, flip: rnd(6, 20)
  }));
  const SONGS = ['whistle', 'trill', 'chirps', 'warble'];
  const birds = Array.from({ length: 4 }, (_, i) => ({
    song: SONGS[i % SONGS.length], f: rnd(2300, 4200), pan: rnd(-0.9, 0.9), dist: rnd(0.2, 1),
    notes: 2 + (Math.random() * 3 | 0), next: ac.currentTime + rnd(2, 12)
  }));
  return { bus, crickets, birds };
}
function voice(t, pan, dist) {             // a spot in the forest: pan, distance (quieter, duller)
  const { ac } = audio, g = ac.createGain();
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000 - dist * 5500;
  const p = ac.createStereoPanner(); p.pan.value = pan;
  g.connect(lp).connect(p).connect(audio.nature.bus);
  return g;
}
function tone(dest, t, dur, f1, f2, amp, vib = 0) {
  const { ac } = audio, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  if (vib) {
    const l = ac.createOscillator(), lg = ac.createGain();
    l.frequency.value = rnd(25, 45); lg.gain.value = vib; l.connect(lg).connect(o.frequency);
    l.start(t); l.stop(t + dur + 0.05);
  }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(amp, t + Math.min(0.02, dur * 0.25));
  g.gain.setValueAtTime(amp, t + dur * 0.6);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function cricketChirp(c, t) {
  const { ac } = audio, o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
  o.frequency.value = c.f; p.pan.value = c.pan;
  g.gain.setValueAtTime(0, t);
  for (let k = 0; k < c.pulses; k++) {   // one chirp = a few fast pulses
    const s = t + k / c.rate;
    g.gain.linearRampToValueAtTime(c.gain * (1 - storm), s + 0.004);   // crickets go quiet in a storm
    g.gain.setValueAtTime(c.gain * (1 - storm), s + 0.014);
    g.gain.linearRampToValueAtTime(0, s + 0.022);
  }
  o.connect(g).connect(p).connect(audio.nature.bus);
  o.start(t); o.stop(t + c.pulses / c.rate + 0.05);
}
function birdSong(b, t) {
  const amp = 0.2 * (1.15 - b.dist), v = voice(t, b.pan, b.dist);
  if (b.song === 'whistle') {            // two or three clear, falling notes
    let f = b.f;
    for (let i = 0; i < b.notes; i++) { const d = rnd(0.22, 0.36); tone(v, t, d, f, f * rnd(0.82, 0.95), amp, 18); t += d + rnd(0.06, 0.14); f *= rnd(0.84, 0.97); }
  } else if (b.song === 'trill') {       // a quick run of tiny rising notes, sinking in pitch
    const n = 6 + b.notes * 2; let f = b.f * 1.15;
    for (let i = 0; i < n; i++) { tone(v, t, 0.04, f, f * 1.25, amp * 0.8); t += 0.066; f *= 0.985; }
  } else if (b.song === 'chirps') {      // a few sharp downward chirps
    for (let i = 0; i < b.notes; i++) { tone(v, t, 0.07, b.f * 1.6, b.f * 0.8, amp); t += rnd(0.13, 0.2); }
  } else {                               // a wandering warble
    const n = 10 + b.notes * 3; let f = b.f;
    for (let i = 0; i < n; i++) { const f2 = Math.min(6000, Math.max(1800, f * rnd(0.8, 1.25))); tone(v, t, 0.06, f, f2, amp * rnd(0.5, 1), 40); t += 0.062; f = f2; }
  }
}
function scheduleNature() {
  if (!audio || !audio.nature) return;
  const n = audio.nature, now = audio.ac.currentTime, ahead = now + 1;
  for (const c of n.crickets) {
    if (c.next < now) c.next = now + 0.1;
    while (c.next < ahead) {
      c.flip -= c.gap;
      if (c.flip <= 0) { c.on = !c.on; c.flip = c.on ? rnd(6, 25) : rnd(3, 15); } // crickets pause and resume
      if (c.on) cricketChirp(c, c.next);
      c.next += c.gap * rnd(0.95, 1.05);
    }
  }
  const hush = Math.max(0.15, 1.2 - intensity * 0.55);  // the harder it rains, the fewer songs
  for (const b of n.birds) {
    if (b.next < now) b.next = now + rnd(0.5, 3);
    if (b.next < ahead) {
      birdSong(b, b.next);
      b.next += rnd(4, 16) / hush;
      if (Math.random() < 0.1) { b.pan = rnd(-0.9, 0.9); b.dist = rnd(0.2, 1); } // flew somewhere else
    }
  }
}
setInterval(scheduleNature, 250);
function setNatureLevel() {
  if (audio && audio.nature) audio.nature.bus.gain.setTargetAtTime(natureVol * 0.9, audio.ac.currentTime, 0.3);
}
function drip() {
  const { ac } = audio, t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = audio.white;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1400 + Math.random() * 4200; bp.Q.value = 3 + Math.random() * 7;
  const g = ac.createGain(), v = 0.015 + Math.random() * 0.07;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04 + Math.random() * 0.07);
  s.connect(bp).connect(g).connect(audio.master);
  s.start(t, Math.random() * 3, 0.15);
}
function updateAudio(dt) {
  if (!audio || !audio.on) return;
  if (Math.random() < intensity * (9 + 14 * storm) * dt) drip();
  audioTimer -= dt;
  if (audioTimer <= 0) {
    audioTimer = 0.5;
    const t = audio.ac.currentTime;
    audio.rainG.gain.setTargetAtTime(0.015 + 0.04 * intensity + 0.06 * storm, t, 0.6);
    audio.roadG.gain.setTargetAtTime(0.04 + 0.32 * speed, t, 1.2);
  }
}

// ---------- fog ----------
// A fine mist of road spray settles on the outside of the glass: faster when the car
// is moving, and heavier toward the bottom of the window. The raindrops are on the
// same side, so every drop sweeps it up: a sliding drop carves a clear path that
// mists over again in ~10 s. (Condensation would be on the inside, where outside
// drops couldn't touch it, so this is spray, not fog.)
const brush = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.6, 'rgba(0,0,0,0.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();
function updateFog(dt) {
  fctx.globalCompositeOperation = 'source-over';
  const a = Math.min(1, dt / FOG_TIME * (0.3 + 1.1 * speed));   // spray comes off the road: more when moving
  const g = fctx.createLinearGradient(0, 0, 0, H);              // ...and more low on the window, near the wheels
  g.addColorStop(0, `rgba(255,255,255,${a * 0.3})`); g.addColorStop(1, `rgba(255,255,255,${a})`);
  fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = 'destination-out';
  for (const d of drops) {
    if (d.r < 2) continue;
    const e = d.r * (d.moving ? 0.95 : 1);              // about the drop's own width (raindrop-fx eraser 0.93–1.0)
    fctx.globalAlpha = d.moving ? 1 : 0.2;                // resting drops sit in a clear spot; sliding ones wipe a path
    fctx.drawImage(brush, d.x - e, d.y - e * 1.3, e * 2, e * 2.6);
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
}

// ---------- storm ----------
// Above ~Rain the weather turns: more and fatter drops, gusts of wind that drive
// them sideways, a darker sky, lightning and thunder.
function updateStorm(dt) {
  MAX_R = curve(SIZE_CURVE, intensity);
  storm += (Math.max(0, Math.min(1, (intensity - 1.6) / 0.9)) - storm) * Math.min(1, dt * 0.8);
  gustT -= dt;
  if (gustT <= 0) {
    gustT = 0.8 + Math.random() * 2.5;
    const strong = Math.random() < 0.3;
    gustTarget = storm * (strong ? 1.1 + Math.random() * 0.6 : Math.random() * 0.5);
    if (strong && storm > 0.5) spray();
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 0.9);   // gusts build and ease off, not snap
  nextFlash -= dt;
  if (nextFlash <= 0) {
    nextFlash = 7 + Math.random() * 16;
    if (storm > 0.35) {
      // a strike is a burst of flickers; thunder follows after a delay set by distance
      const t0 = performance.now() / 1000, near = Math.random();
      bolts = [[t0, 0.9 + near * 0.3]];
      for (let i = 0, t = t0; i < 2 + Math.random() * 4; i++) { t += 0.05 + Math.random() * 0.18; bolts.push([t, 0.2 + Math.random() * 0.8]); }
      thunder(0.6 + (1 - near) * 3, 0.4 + near * 0.6);
    }
  }
  const t = performance.now() / 1000;
  flash = 0;
  for (const [t0, lvl] of bolts) if (t >= t0) flash = Math.max(flash, lvl * Math.exp(-(t - t0) / 0.07));
  flash *= storm;
}
function spray() {
  const cx = Math.random() * W, cy = Math.random() * H * 0.8, R = 120 + Math.random() * 200;
  for (let i = 0; i < 40 * storm; i++) {
    const a = Math.random() * TAU, r = R * Math.sqrt(Math.random());
    const d = spawnDrop(cx + Math.cos(a) * r * 1.4, cy + Math.sin(a) * r, K * (1 + Math.random() * 2.2));
    if (d) d.splat = 1.2;
  }
  for (let i = 0; i < 400 * storm; i++) {
    const a = Math.random() * TAU, r = R * 1.2 * Math.sqrt(Math.random());
    mistDot(cx + Math.cos(a) * r * 1.4, cy + Math.sin(a) * r, mistR());
  }
}
function thunder(delay, power) {
  if (!audio || !audio.on) return;
  const { ac } = audio, t = ac.currentTime + delay;
  const s = ac.createBufferSource(); s.buffer = audio.brown; s.playbackRate.value = 0.55;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900 * power + 200, t); lp.frequency.exponentialRampToValueAtTime(120, t + 3.5);
  const g = ac.createGain(), len = 3.5 + Math.random() * 3;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.9 * power, t + 0.08 + (1 - power) * 0.5);
  for (let k = 1; k < 6; k++) g.gain.linearRampToValueAtTime(power * (0.3 + Math.random() * 0.6) * (1 - k / 7), t + k * len / 7); // rolling
  g.gain.linearRampToValueAtTime(0, t + len);
  s.connect(lp).connect(g).connect(audio.master);
  s.start(t, Math.random() * 2, len + 0.1);
}

// ---------- loop & input ----------
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  requestAnimationFrame(frame);
  if (innerWidth !== W || innerHeight !== H) { if (innerWidth > 0 && innerHeight > 0) resize(); return; }
  if (!W || !H) return;
  updateStorm(dt);
  updateForest(dt);
  frameDt = dt;
  drawScene();
  updateDrops(dt);
  updateFog(dt);
  drawWater();
  render();
  updateAudio(dt);
}
let idleT;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => island.matches(':hover') ? wake() : document.body.classList.add('idle'), 3000);
}
addEventListener('mousemove', wake);
addEventListener('pointerdown', () => { toggleAudio(); refreshUI(); wake(); });
// ---------- the control island ----------
// Collapsed: a small glass pill showing the weather. Hover (or tap) to open it:
// four weather presets, then dot meters for rain, volume and nature sounds.
// Settings are remembered between visits.
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const recall = k => { try { return parseFloat(localStorage.getItem(k)); } catch (e) { return NaN; } };
const RAIN_MAX = 2.5, DOTS = 16;
const PRESETS = [
  { name: 'Mist', v: 0.3, icon: 'mist' }, { name: 'Drizzle', v: 0.7, icon: 'drizzle' },
  { name: 'Rain', v: 1.3, icon: 'rain' }, { name: 'Storm', v: 2.5, icon: 'storm' }
];
const weatherOf = v => v < 0.5 ? PRESETS[0] : v < 1 ? PRESETS[1] : v < 1.8 ? PRESETS[2] : PRESETS[3];
function icon(kind, size) {
  const cloud = '<path d="M7.5 17.5h9.2a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8 1.1A3.3 3.3 0 0 0 7.5 17.5z" fill="currentColor"/>';
  const line = 'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"';
  const below = {
    mist: `<path d="M5 20.3h9.5M8.5 23h9.5" ${line}/>`,
    drizzle: '<circle cx="9.5" cy="20.6" r="1" fill="currentColor"/><circle cx="14.5" cy="21.8" r="1" fill="currentColor"/>',
    rain: `<path d="M9.2 19.6l-1 2.6M12.7 19.6l-1 2.6M16.2 19.6l-1 2.6" ${line}/>`,
    storm: `<path d="M13 18.6l-2.3 2.8h2.5l-1.7 2.6" ${line} stroke-linejoin="round"/><path d="M8.6 19.6l-.9 2.2M17.2 19.6l-.9 2.2" ${line}/>`
  }[kind];
  return `<svg viewBox="2 4.5 20 20.5" width="${size}" height="${size}" aria-hidden="true">${cloud}${below}</svg>`;
}
const SPEAKER = on => `<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/>${on
  ? '<path d="M15.3 9.2a4 4 0 0 1 0 5.6M17.8 6.8a7.5 7.5 0 0 1 0 10.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
  : '<path d="M16 9.8l4.4 4.4M20.4 9.8L16 14.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'}</svg>`;

const island = document.getElementById('island'), head = document.getElementById('islandHead');
const presetsEl = island.querySelector('.presets');
presetsEl.innerHTML = PRESETS.map((p, i) =>
  `<button data-i="${i}"><span class="t">${p.name}</span>${icon(p.icon, 26)}<span class="n">${Math.round(p.v / RAIN_MAX * 100)}%</span></button>`).join('');
presetsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setRain(PRESETS[+b.dataset.i].v); });
head.querySelector('.mini').innerHTML = '<i></i>'.repeat(8);

function makeMeter(host, label, max, get, set, withMute) {
  host.innerHTML = `<div class="mh"><span class="ml">${withMute ? '<button class="mute"></button>' : ''}${label}</span><span class="mv"></span></div>
    <div class="dots" role="slider" tabindex="0" aria-label="${label}" aria-valuemin="0" aria-valuemax="100">${'<i></i>'.repeat(DOTS)}</div>`;
  const dots = host.querySelector('.dots'), cells = [...dots.children], mv = host.querySelector('.mv');
  const at = x => { const r = dots.getBoundingClientRect(); return Math.max(0, Math.min(1, Math.ceil((x - r.left) / r.width * DOTS) / DOTS)); };
  let dragging = false;
  dots.addEventListener('pointerdown', e => {
    dragging = true; dots.setPointerCapture(e.pointerId);
    let f = at(e.clientX);
    if (f === 1 / DOTS && Math.round(get() / max * DOTS) === 1) f = 0;  // tap the only lit dot to turn it off
    set(f * max);
  });
  dots.addEventListener('pointermove', e => { if (dragging) set(at(e.clientX) * max); });
  for (const ev of ['pointerup', 'pointercancel']) dots.addEventListener(ev, () => { dragging = false; });
  dots.addEventListener('keydown', e => {
    const step = max / DOTS;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') set(Math.min(max, get() + step));
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') set(Math.max(0, get() - step));
    else return;
    e.preventDefault(); e.stopPropagation();
  });
  const mute = host.querySelector('.mute');
  if (mute) mute.addEventListener('click', () => { toggleAudio(); refreshUI(); });
  return {
    update() {
      const f = get() / max, lit = Math.round(f * DOTS);
      cells.forEach((c, i) => c.classList.toggle('on', i < lit));
      mv.textContent = Math.round(f * 100) + '%';
      dots.setAttribute('aria-valuenow', Math.round(f * 100));
      if (mute) {
        const on = !!(audio && audio.on);
        mute.innerHTML = SPEAKER(on); mute.setAttribute('aria-label', on ? 'Mute' : 'Sound on');
      }
    }
  };
}
const meters = [
  makeMeter(document.getElementById('mRain'), 'Rain', RAIN_MAX, () => intensity, v => setRain(v)),
  makeMeter(document.getElementById('mVol'), 'Volume', 1, () => volume, v => setVolume(v), true),
  makeMeter(document.getElementById('mNature'), 'Birds & insects', 1, () => natureVol, v => setNature(v))
];
function refreshUI() {
  const w = weatherOf(intensity);
  head.querySelector('.ico').innerHTML = icon(w.icon, 22);
  head.querySelector('.name').textContent = intensity < 0.05 ? 'Clear' : w.name;
  head.querySelector('.sub').textContent = Math.round(intensity / RAIN_MAX * 100) + '%';
  const lit = Math.round(intensity / RAIN_MAX * 8);
  head.querySelectorAll('.mini i').forEach((c, i) => c.classList.toggle('on', i < lit));
  presetsEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', PRESETS[i] === w && intensity >= 0.05));
  meters.forEach(m => m.update());
}
function setRain(v) { intensity = v; store('rain-amount', v); refreshUI(); }
function setVolume(v) {
  volume = v; store('rain-volume', v);
  if (!audio && v > 0) toggleAudio();                      // turning it up is enough to start the sound
  else if (audio) {
    if (!audio.on && v > 0) { audio.on = true; audio.ac.resume(); }
    audio.master.gain.setTargetAtTime(audio.on ? v : 0, audio.ac.currentTime, 0.15);
  }
  refreshUI();
}
function setNature(v) {
  natureVol = v; store('rain-nature', v);
  if (!audio && v > 0) toggleAudio(); else setNatureLevel();
  refreshUI();
}
if (!isNaN(recall('rain-amount'))) intensity = recall('rain-amount');
if (!isNaN(recall('rain-volume'))) volume = recall('rain-volume');
if (!isNaN(recall('rain-nature'))) natureVol = recall('rain-nature');
refreshUI();

// open on hover with a mouse; tap the pill to open/close on touch or keyboard
const setOpen = o => { island.classList.toggle('open', o); head.setAttribute('aria-expanded', o); };
island.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setOpen(true); });
island.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setOpen(false); });
head.addEventListener('click', () => setOpen(!island.classList.contains('open')));
island.addEventListener('pointerdown', e => e.stopPropagation());   // using the controls doesn't toggle mute
island.addEventListener('keydown', e => { if (e.key === 'Escape') { setOpen(false); head.focus(); } e.stopPropagation(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setRain(Math.min(2.5, intensity + 0.25));
  else if (e.key === 'ArrowDown') setRain(Math.max(0, intensity - 0.25));
  else if (e.key === 'f' || e.key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  } else if (e.key === 's' || e.key === 'S') toggleAudio();
  else return;
  wake();
});
wake();
requestAnimationFrame(frame);
</script>
</body>
</html>
